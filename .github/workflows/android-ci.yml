name: Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager --list

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Start Firebase Auth Emulator
        run: |
          firebase emulators:start --only auth > firebase-emulator.log 2>&1 &
          timeout 60 bash -c 'until curl -s http://127.0.0.1:9099/ > /dev/null; do sleep 2; done'

      - name: Build project
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew test

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim
          script: |
            adb reverse tcp:9099 tcp:9099
            ./gradlew connectedAndroidTest

      - name: Upload Firebase emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-emulator-logs
          path: firebase-emulator.log
          if-no-files-found: ignore
